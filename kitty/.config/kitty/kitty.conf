# Minimal Kitty overrides; machine/OS details stay in the shell configs.

font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        family="JetBrainsMono Nerd Font Mono" style=Bold
italic_font      auto
bold_italic_font family="JetBrainsMono Nerd Font Mono" style=SemiBold
font_size        16.0

disable_ligatures always

# Use the account's login shell and the editor exported by the shell config.
# This keeps the same file portable to Linux and macOS. On Linux, interactive
# bash hands off to fish via ~/.bashrc when the bootstrap is installed.

macos_titlebar_color background

# Theme generated from kanagawa.nvim.
include current-theme.conf
